plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 35

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('cn.living.tv')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName '3.3-cn.11'
    }

    def releaseKeystore = System.getenv('LIVINGTV_KEYSTORE')
    if (releaseKeystore) {
        signingConfigs {
            livingRelease {
                storeFile file(releaseKeystore)
                storePassword System.getenv('LIVINGTV_STORE_PASSWORD')
                keyAlias System.getenv('LIVINGTV_KEY_ALIAS') ?: 'livingtv'
                keyPassword System.getenv('LIVINGTV_KEY_PASSWORD') ?: storePassword
            }
        }
    }
    testBuildType releaseKeystore ? 'release' : 'debug'
    buildTypes {
        release {
            // The integrated Media3/Kotlin build keeps its public APIs for release-device acceptance.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore) signingConfig signingConfigs.livingRelease
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.media3:media3-ui:1.4.1'
 androidTestImplementation 'androidx.media3:media3-common:1.4.1'
 androidTestImplementation 'com.google.errorprone:error_prone_annotations:2.28.0'
 implementation project(':features')
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
